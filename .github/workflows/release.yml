name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned tag of the sibling am-fs-core repo used to satisfy the path dep
  # during local build/verify. Bump in lockstep with the am-fs-core version
  # constraint in Cargo.toml when releasing a new fs-ext4 minor.
  FS_CORE_REF: v0.2.6

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      # capi_basic integration tests mount real ext4 images generated by
      # the qemu-hosted Alpine VM in test-disks/. Mirrors ci.yml's setup
      # so the release-time check exercises the same path as PR CI.
      - name: install qemu (for test-disk generator)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 libarchive-tools
      - name: cache alpine VM assets
        uses: actions/cache@v4
        with:
          path: test-disks/.vm-cache
          key: vm-cache-alpine-3.21.4
      - name: generate test disks
        run: bash test-disks/build-ext4-feature-images.sh

      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Strict functional gate: build the mkfs_ext4 CLI, format an image, and
  # run the kernel's own fsck.ext4 (from e2fsprogs) against it. This is the
  # canonical "does Linux think this is a valid ext4 volume?" oracle —
  # stricter than the crate's own read-path round-trip because it exercises
  # every assertion in e2fsck's superblock + group-descriptor + inode-table
  # validation, including metadata-csum. Publish is gated on this passing so
  # a regression in the mkfs path can never ship to crates.io. Mirrors the
  # validate-mkfs-bin job in ci.yml.
  validate-fsck:
    name: validate mkfs_ext4 (fsck.ext4 strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2

      - name: install e2fsprogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs

      - name: build mkfs_ext4
        run: cargo build --locked --release --bin mkfs_ext4

      # 32 MiB is the v1 single-block-group cap. Keep it as the smoke
      # test target and add a larger one once multi-group lands.
      - name: format 32 MiB image and validate with fsck.ext4
        run: |
          truncate -s 32M /tmp/out.img
          ./target/release/mkfs_ext4 -L CITEST -U deadbeef-cafe-1234-5678-0123456789ab /tmp/out.img
          # -f forces a check even if FS thinks it's clean; -n declines
          # any repair offer (so this is read-only and exits non-zero
          # if anything is wrong rather than silently auto-fixing).
          fsck.ext4 -fnv /tmp/out.img

      - name: verify volume label and UUID round-tripped
        run: |
          # tune2fs prints the on-disk superblock metadata; grep confirms
          # the CLI args propagated to the bytes fsck just validated.
          tune2fs -l /tmp/out.img > /tmp/sb.txt
          cat /tmp/sb.txt
          grep -q "Filesystem volume name:.*CITEST" /tmp/sb.txt
          grep -qi "Filesystem UUID:.*deadbeef-cafe-1234-5678-0123456789ab" /tmp/sb.txt

  # Build the CLI as a downloadable binary, so it can be installed with a
  # package manager rather than `cargo install`.
  #
  # THE BINARY IS RENAMED HERE, and that is the point of this job. Cargo
  # refuses a dot in a target name ("invalid character '.' in crate
  # name"), so the target is `mkfs_ext4` and the published artifact is
  # `mkfs.ext4` — the name the format's convention actually uses, and the
  # one `mkfs -t ext4` resolves to. The underscore is a build-system
  # constraint and has no business appearing in a public artifact, so the
  # rename happens before packaging rather than in a package manager's
  # formula, where a direct downloader would never see it.
  #
  # Native builds only, one runner per platform: cross-compiling Rust
  # needs either a cross toolchain or an emulator, and neither is worth
  # it for two targets that GitHub already provides natively.
  package-cli:
    name: package mkfs.ext4 (${{ matrix.label }})
    needs: [test, validate-fsck]
    permissions:
      # `gh release` writes assets onto the tag's release.
      contents: write
    strategy:
      # One platform failing should not hide whether the other built.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: darwin-arm64
          - runner: ubuntu-latest
            label: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2

      - name: build mkfs_ext4
        shell: bash
        run: cargo build --release --locked --bin mkfs_ext4

      - name: package as mkfs.ext4
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^name = ' Cargo.toml | sed 's/name = //; s/"//g')"
          tarball="${crate}-${version}-${{ matrix.label }}.tar.gz"

          # Staged in a directory of its own so the archive holds exactly
          # the binary and its licence, with no leading path components
          # for a package manager to strip.
          staging="$(mktemp -d)"
          cp target/release/mkfs_ext4 "$staging/mkfs.ext4"
          cp LICENSE "$staging/LICENSE"
          tar -czf "$tarball" -C "$staging" mkfs.ext4 LICENSE

          # The formula needs this to verify the download; printing it
          # into the job summary means updating a formula is a copy, not
          # a local re-download and re-hash.
          sum="$(shasum -a 256 "$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          {
            echo "### $tarball"
            echo ""
            echo '```'
            echo "sha256 $sum"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A tarball whose binary will not run is worse than no tarball,
      # and the failure would otherwise surface as a user's bug report
      # rather than a red build. `--help` exercises argument parsing and
      # exits 0; formatting a real image is what validate-fsck already
      # covers.
      - name: smoke-test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          tar -xzf "${{ steps.pack.outputs.tarball }}" -C "$probe"
          test -x "$probe/mkfs.ext4"
          "$probe/mkfs.ext4" --help > /dev/null

      # The release for a tag may not exist yet — this repo's tags have
      # historically been published to crates.io without a GitHub
      # release. Create it if absent so the upload has somewhere to go,
      # and let two matrix legs race harmlessly: whichever arrives first
      # creates it, the other's `view` succeeds.
      - name: upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes \
            || gh release view "$tag" >/dev/null
          gh release upload "$tag" "${{ steps.pack.outputs.tarball }}" --clobber

  publish:
    name: publish to crates.io
    needs: [test, validate-fsck]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a release published by hand — would otherwise fail
      # this job every time. Skip instead, so the workflow is idempotent
      # and a red run means something actually went wrong.
      - name: skip if this version is already on crates.io
        id: already
        shell: bash
        run: |
          set -euo pipefail
          name="$(grep -m1 '^name = ' Cargo.toml | sed 's/name = //; s/"//g')"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if curl -sf "https://crates.io/api/v1/crates/$name/$version" \
               -H 'User-Agent: release-workflow' >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io; publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # No `--locked`: publish must rewrite the `am-fs-core` path
        # dependency into its registry equivalent in the packaged
        # lockfile, which `--locked` forbids ("cannot update the lock
        # file"). The verify-build resolves am-fs-core from crates.io
        # via the `version` constraint, so the published artifact is
        # pinned by that constraint, not by the local path checkout.
        run: cargo publish
